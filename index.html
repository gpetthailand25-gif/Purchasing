const { useState, useEffect, useRef, useMemo, useCallback, Fragment } = React;

/* ============================================================================
   ENGINE — คัดลอกจาก bakery-mrp/src/engine/*.js (ทำงานเหมือนเดิมทุกประการ)
   ============================================================================ */

class CircularBomError extends Error {
  constructor(path) {
    super('ไม่สามารถสร้าง BOM ได้ เนื่องจากเกิด Circular Reference: ' + path.join(' -> '));
    this.name = 'CircularBomError';
    this.path = path;
  }
}

function wouldCreateCycle(parentProductId, componentProductId, getSemiFinishedChildren) {
  if (String(parentProductId) === String(componentProductId)) return true;
  const visited = new Set();
  function dfs(node) {
    if (String(node) === String(parentProductId)) return true;
    const key = String(node);
    if (visited.has(key)) return false;
    visited.add(key);
    const children = getSemiFinishedChildren(node) || [];
    for (const child of children) if (dfs(child)) return true;
    return false;
  }
  return dfs(componentProductId);
}

function explodeBOM(productId, requiredQty, asOfDate, repo, visitedPath = []) {
  if (visitedPath.some((p) => String(p) === String(productId))) {
    throw new CircularBomError([...visitedPath, productId]);
  }
  const newPath = [...visitedPath, productId];
  const bom = repo.getActiveBom(productId, asOfDate);
  if (!bom) return [];
  const results = [];
  for (const detail of bom.details) {
    const yieldFactor = (detail.yieldPct ?? 100) / 100;
    const lossFactor = 1 + (detail.lossPct ?? 0) / 100;
    if (yieldFactor <= 0) throw new Error('yield_pct ต้องมากกว่า 0 (bom_detail_id=' + detail.bomDetailId + ')');
    const neededQty = (requiredQty * detail.quantity / yieldFactor) * lossFactor;
    if (detail.componentType === 'RAW_MATERIAL' || detail.componentType === 'PACKAGING') {
      results.push({ type: detail.componentType, id: detail.componentId, qty: neededQty, unit: detail.unit, source: { product: productId, bomDetailId: detail.bomDetailId, path: newPath } });
    } else if (detail.componentType === 'SEMI_FINISHED') {
      results.push({ type: 'SEMI_FINISHED', id: detail.componentId, qty: neededQty, unit: detail.unit, source: { product: productId, bomDetailId: detail.bomDetailId, path: newPath } });
      results.push(...explodeBOM(detail.componentId, neededQty, asOfDate, repo, newPath));
    } else {
      throw new Error('Unknown component_type: ' + detail.componentType);
    }
  }
  return results;
}

function aggregateRequirement(explodedList) {
  const groups = new Map();
  for (const item of explodedList) {
    const key = item.type + ':' + item.id;
    if (!groups.has(key)) groups.set(key, { type: item.type, id: item.id, unit: item.unit, totalQty: 0, breakdown: [] });
    const group = groups.get(key);
    group.totalQty += item.qty;
    group.breakdown.push({ qty: item.qty, source: item.source });
  }
  return Array.from(groups.values());
}

function explodeAndAggregate(forecastLines, asOfDate, repo) {
  const all = [];
  for (const line of forecastLines) all.push(...explodeBOM(line.productId, line.quantity, asOfDate, repo));
  return aggregateRequirement(all);
}

function calculateBomCost(productId, asOfDate, repo) {
  const bom = repo.getActiveBom(productId, asOfDate);
  if (!bom) return repo.getMaterialPrice ? (repo.getMaterialPrice(productId) || 0) : 0;
  let total = 0;
  for (const detail of bom.details) {
    const yieldFactor = (detail.yieldPct ?? 100) / 100;
    const lossFactor = 1 + (detail.lossPct ?? 0) / 100;
    const unitCost = detail.componentType === 'SEMI_FINISHED'
      ? calculateBomCost(detail.componentId, asOfDate, repo)
      : (repo.getMaterialPrice ? (repo.getMaterialPrice(detail.componentId) || 0) : 0);
    total += (unitCost * detail.quantity / yieldFactor) * lossFactor;
  }
  return total;
}

function calculateMRP(forecastLines, asOfDate, repo) {
  const aggregated = explodeAndAggregate(forecastLines, asOfDate, repo);
  const results = [];
  for (const item of aggregated) {
    const stock = repo.getStock(item.type, item.id) || 0;
    const safetyStock = (repo.getSafetyStock && repo.getSafetyStock(item.id)) || 0;
    const scheduledReceipt = (repo.getScheduledReceipt && repo.getScheduledReceipt(item.id)) || 0;
    const openQty = item.type === 'SEMI_FINISHED'
      ? (repo.getOpenProductionQty && repo.getOpenProductionQty(item.id)) || 0
      : (repo.getOpenPoQty && repo.getOpenPoQty(item.id)) || 0;
    const grossRequirement = item.totalQty;
    let netRequirement = grossRequirement + safetyStock - stock - openQty - scheduledReceipt;
    let status;
    if (netRequirement < 0) {
      netRequirement = 0;
      status = item.type === 'SEMI_FINISHED' ? 'Stock + Open Production เพียงพอ' : 'Stock + Open PO เพียงพอ';
    } else {
      status = item.type === 'SEMI_FINISHED' ? 'ต้องผลิตเพิ่ม' : 'ต้องสั่งเพิ่ม';
    }
    const conversionRate = (repo.getConversionRate && repo.getConversionRate(item.id)) || 1;
    const purchaseQtyNeeded = conversionRate > 0 ? Math.ceil(netRequirement / conversionRate) : null;
    const price = (repo.getMaterialPrice && repo.getMaterialPrice(item.id)) || 0;
    const requirementValue = round2(netRequirement * price);
    results.push({
      type: item.type, id: item.id, unit: item.unit,
      grossRequirement: round3(grossRequirement), safetyStock, currentStock: stock, openQty, scheduledReceipt,
      netRequirement: round3(netRequirement), purchaseQtyNeeded, requirementValue, status, breakdown: item.breakdown,
    });
  }
  return results;
}

function calculateIncrementalMRP(adjustmentLines, asOfDate, repo) {
  return calculateMRP(adjustmentLines, asOfDate, repo);
}

function calculateReceivingStatus(orderedQty, receivedQty) {
  const outstanding = Math.max(0, round3(orderedQty - receivedQty));
  let status;
  if (receivedQty <= 0) status = 'Not Received';
  else if (outstanding > 0) status = 'Partially Received';
  else status = 'Received';
  return { outstanding, status };
}

function calculateOverdue(expectedDeliveryDate, today, isFullyReceived) {
  if (isFullyReceived) return { isOverdue: false, delayDays: 0 };
  const msPerDay = 24 * 60 * 60 * 1000;
  const delayDays = Math.floor((today.getTime() - expectedDeliveryDate.getTime()) / msPerDay);
  return { isOverdue: delayDays > 0, delayDays: Math.max(0, delayDays) };
}

function round3(n) { return Math.round(n * 1000) / 1000; }
function round2(n) { return Math.round(n * 100) / 100; }

class HttpError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}

  }

  function getDashboardExecutive(year, month, asOfDate, today = new Date()) {
    const mrp = calculateMrpForPeriodSafe(year, month, asOfDate);
    const allMrpItems = [...mrp.base, ...mrp.incremental];
    const forecastLines = listForecast(year, month);
    const repo = toEngineRepo(asOfDate);
    const forecastValue = forecastLines.reduce((s, f) => s + f.quantity * calculateBomCost(f.productId, asOfDate, repo), 0);
    const requirementValue = allMrpItems.reduce((s, r) => s + r.grossRequirement * ((materials[r.id] || {}).price || 0), 0);
    const pos = trackedPOs(today);
    const openPOs = pos.filter(isOpenPO);
    const actualPurchaseValue = pos.filter((po) => sameMonth(po.poDate, year, month)).reduce((s, po) => s + po.lines.reduce((ls, l) => ls + poLineValue(l), 0), 0);
    const openPoValue = openPOs.reduce((s, po) => s + po.lines.reduce((ls, l) => ls + poLineValue(l), 0), 0);
    const receivedValue = pos.reduce((s, po) => s + po.lines.reduce((ls, l) => ls + poReceivedValue(l), 0), 0);
    const outstandingValue = openPOs.reduce((s, po) => s + po.lines.reduce((ls, l) => ls + poOutstandingValue(l), 0), 0);
    const overdueValue = pos.filter((po) => po.isOverdue).reduce((s, po) => s + po.lines.reduce((ls, l) => ls + poOutstandingValue(l), 0), 0);
    const monthlyPurchase = groupByYearMonth(pos, (po) => po.lines.reduce((s, l) => s + poLineValue(l), 0));
    const forecastByMonth = new Map();
    for (const [key, f] of forecastEntriesByPeriod()) {
      const lineForecastValue = f.quantity * calculateBomCost(f.productId, asOfDate, toEngineRepo(asOfDate));
      forecastByMonth.set(key, (forecastByMonth.get(key) || 0) + lineForecastValue);
    }
    const actualByMonth = groupByYearMonth(pos, (po) => po.lines.reduce((s, l) => s + poLineValue(l), 0));
    const forecastVsActual = mergeMonthlySeries(forecastByMonth, actualByMonth);
    const openPoBySupplier = groupBySupplier(openPOs, (po) => po.lines.reduce((s, l) => s + poLineValue(l), 0));
    const outstandingBySupplier = groupBySupplier(openPOs, (po) => po.lines.reduce((s, l) => s + poOutstandingValue(l), 0));
    const topMaterials = topMaterialsByPurchaseValue(pos);
    const recentPriceIncreases = priceHistory.filter((p) => p.toPrice > p.fromPrice).slice(-10).reverse().map((p) => ({ materialId: p.materialId, material: (materials[p.materialId] || {}).name, from: p.fromPrice, to: p.toPrice, pct: round2(((p.toPrice - p.fromPrice) / p.fromPrice) * 100), supplier: (suppliers[p.supplierId] || {}).name, date: p.date }));
    const materialRisk = Object.entries(materials).filter(([id, m]) => (stock[id] || 0) < m.safetyStock).map(([id, m]) => ({ materialId: id, material: m.name, stock: stock[id] || 0, safetyStock: m.safetyStock, level: (stock[id] || 0) < m.safetyStock * 0.5 ? 'critical' : 'warning' }));
    return {
      period: { year: Number(year), month: Number(month) },
      kpis: { forecastValue: round2(forecastValue), requirementValue: round2(requirementValue), actualPurchaseValue: round2(actualPurchaseValue), openPoValue: round2(openPoValue), receivedValue: round2(receivedValue), outstandingPoValue: round2(outstandingValue), overduePoValue: round2(overdueValue) },
      charts: { monthlyPurchase, forecastVsActual, openPoBySupplier, outstandingBySupplier, topMaterials },
      priceIncreases: recentPriceIncreases,
      materialRisk,
    };
  }

  function forecastEntriesByPeriod() { return Array.from(forecasts.entries()).map(([key, f]) => [f.year + '-' + String(f.month).padStart(2, '0'), f]); }
  function sameMonth(dateStr, year, month) { const d = new Date(dateStr); return d.getFullYear() === Number(year) && d.getMonth() + 1 === Number(month); }
  function groupByYearMonth(pos, valueFn) {
    const map = new Map();
    for (const po of pos) { const key = po.poDate.slice(0, 7); map.set(key, (map.get(key) || 0) + valueFn(po)); }
    return Array.from(map.entries()).sort(([a], [b]) => a.localeCompare(b)).map(([month, value]) => ({ month, value: round2(value) }));
  }
  function mergeMonthlySeries(forecastMap, actualSeries) {
    const keys = new Set([...forecastMap.keys(), ...actualSeries.map((a) => a.month)]);
    const actualMap = new Map(actualSeries.map((a) => [a.month, a.value]));
    return Array.from(keys).sort().map((month) => ({ month, forecast: round2(forecastMap.get(month) || 0), actual: round2(actualMap.get(month) || 0) }));
  }
  function groupBySupplier(pos, valueFn) {
    const map = new Map();
    for (const po of pos) map.set(po.supplierId, (map.get(po.supplierId) || 0) + valueFn(po));
    return Array.from(map.entries()).map(([supplierId, value]) => ({ supplierId, supplier: (suppliers[supplierId] || {}).name, value: round2(value) })).sort((a, b) => b.value - a.value);
  }
  function topMaterialsByPurchaseValue(pos) {
    const map = new Map();
    for (const po of pos) for (const l of po.lines) map.set(l.materialId, (map.get(l.materialId) || 0) + poLineValue(l));
    return Array.from(map.entries()).map(([materialId, value]) => ({ materialId, material: (materials[materialId] || {}).name, value: round2(value) })).sort((a, b) => b.value - a.value).slice(0, 10);
  }

  function snapshot() {
    return {
      products: JSON.parse(JSON.stringify(products)),
      materials: JSON.parse(JSON.stringify(materials)),
      boms: JSON.parse(JSON.stringify(boms)),
      suppliers: JSON.parse(JSON.stringify(suppliers)),
      stock: JSON.parse(JSON.stringify(stock)),
      forecasts: Array.from(forecasts.entries()).map(([key, value]) => ({ key, value })),
      purchaseOrders: JSON.parse(JSON.stringify(purchaseOrders)),
      priceHistory: JSON.parse(JSON.stringify(priceHistory)),
      nextPoId, nextBomDetailId,
    };
  }

  function hydrate(data) {
    if (!data) return;
    if (data.products) { for (const k of Object.keys(products)) delete products[k]; Object.assign(products, data.products); }
    if (data.materials) { for (const k of Object.keys(materials)) delete materials[k]; Object.assign(materials, data.materials); }
    if (data.boms) { for (const k of Object.keys(boms)) delete boms[k]; Object.assign(boms, data.boms); }
    if (data.suppliers) { for (const k of Object.keys(suppliers)) delete suppliers[k]; Object.assign(suppliers, data.suppliers); }
    if (data.stock) { for (const k of Object.keys(stock)) delete stock[k]; Object.assign(stock, data.stock); }
    if (Array.isArray(data.forecasts)) { forecasts.clear(); for (const entry of data.forecasts) forecasts.set(entry.key, entry.value); }
    if (Array.isArray(data.purchaseOrders)) { purchaseOrders.length = 0; purchaseOrders.push(...data.purchaseOrders); }
    if (Array.isArray(data.priceHistory)) { priceHistory.length = 0; priceHistory.push(...data.priceHistory); }
    if (typeof data.nextPoId === 'number') nextPoId = data.nextPoId;
    if (typeof data.nextBomDetailId === 'number') nextBomDetailId = data.nextBomDetailId;
  }

  return {
    products, materials, suppliers,
    createProduct, deleteProduct, createMaterial, updateMaterial, deleteMaterial,
    upsertForecast, addForecastAdjustment, listForecast, calculateMrpForPeriod,
    getBomTree, whereUsed, addBomDetail, removeBomDetail,
    createPurchaseOrder, getPurchaseOrder, listPurchaseOrdersTracking, receiveGoods,
    getDashboardPurchasing, getDashboardExecutive,
    snapshot, hydrate,
  };
}

/* ============================================================================
   PERSISTENCE — Firestore (client-side, ดู FIREBASE_CONFIG ด้านบนสุดของไฟล์)

async function loadSnapshotFromFirestore() {
  const db = window.__firestoreDb;
  if (!db) return null;
  try {
    const doc = await db.collection('app_state').doc('snapshot').get();
    return doc.exists ? (doc.data().data || null) : null;
  } catch (e) {
    console.error('[persistence] โหลดข้อมูลไม่สำเร็จ:', e);
    return null;
  }
}

let __saveTimer = null;
function scheduleSave(store) {
  const db = window.__firestoreDb;
  if (!db) return;
  clearTimeout(__saveTimer);
  __saveTimer = setTimeout(async () => {
    try {
      await db.collection('app_state').doc('snapshot').set({ data: store.snapshot(), savedAt: new Date().toISOString() });
    } catch (e) {
      console.error('[persistence] บันทึกข้อมูลไม่สำเร็จ:', e);
    }
  }, 1200);
}

/**
 * SearchableSelect — dropdown ที่พิมพ์ค้นหาได้ (สำหรับรายการยาวๆ เช่น วัตถุดิบ 700+ รายการ)
 * options: array ของ [id, label] — label ควรมีทั้งรหัส+ชื่อ เพื่อค้นหาได้ทั้งสองแบบ
 */
function SearchableSelect({ options, value, onChange, placeholder = 'พิมพ์ค้นหา...' }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const containerRef = useRef(null);

  useEffect(() => {
    function handleClickOutside(e) {
      if (containerRef.current && !containerRef.current.contains(e.target)) { setOpen(false); setQuery(''); }
    }
    document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, []);

  const selected = options.find(([id]) => id === value);
  const q = query.trim().toLowerCase();
  const filtered = q === '' ? options : options.filter(([id, label]) => label.toLowerCase().includes(q));
  const shown = filtered.slice(0, 200);

  return (
    <div className="relative" ref={containerRef}>
      <input
        value={open ? query : (selected ? selected[1] : '')}
        onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
        onFocus={() => { setQuery(''); setOpen(true); }}
        placeholder={placeholder}
        className="w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500"
      />
      {open && (
        <div className="absolute z-20 mt-1 max-h-64 w-full min-w-[280px] overflow-y-auto rounded-lg border border-slate-200 bg-white shadow-lg">
          {shown.length === 0 && <div className="px-3 py-2 text-xs text-slate-400">ไม่พบรายการ</div>}
          {shown.map(([id, label]) => (
            <button key={id} type="button" onMouseDown={(e) => e.preventDefault()} onClick={() => { onChange(id); setOpen(false); setQuery(''); }}
              className={`block w-full truncate px-3 py-1.5 text-left text-sm hover:bg-amber-50 ${id === value ? 'bg-amber-50 font-medium text-amber-800' : 'text-slate-700'}`}>
              {label}
            </button>
          ))}
          {filtered.length > shown.length && <div className="border-t border-slate-100 px-3 py-1.5 text-[11px] text-slate-400">พบ {filtered.length} รายการ — พิมพ์เพิ่มเพื่อจำกัดผลลัพธ์</div>}
        </div>
      )}
    </div>
  );
}

function resolvePeriod() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const asOfDate = `${year}-${String(month).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  return { year, month, asOfDate };
}

function PurchasingDashboard({ store }) {
  const { year, month, asOfDate } = resolvePeriod();
  const data = store.getDashboardPurchasing(year, month, asOfDate);
  const { kpis, actionRequired, materialsBelowSafety } = data;
  const kpiTiles = [
    { label: 'รายการที่ต้องสั่ง', value: kpis.itemsToOrder, suffix: 'รายการ' },
    { label: 'มูลค่าที่ต้องสั่ง', value: fmtBaht(kpis.valueToOrder) },
    { label: 'PO เปิดแล้ว', value: kpis.openPoCount, suffix: 'ใบ' },
    { label: 'Open PO Value', value: fmtBaht(kpis.openPoValue) },
    { label: 'Received Value', value: fmtBaht(kpis.receivedValue) },
    { label: 'Outstanding Value', value: fmtBaht(kpis.outstandingValue) },
    { label: 'Overdue Value', value: fmtBaht(kpis.overdueValue), tone: kpis.overdueValue > 0 ? 'critical' : undefined },
    { label: 'ต่ำกว่า Safety Stock', value: kpis.belowSafetyStockCount, suffix: 'รายการ', tone: kpis.belowSafetyStockCount > 0 ? 'critical' : undefined },
  ];
  const LEVEL_STYLE = { info: 'bg-sky-50 text-sky-700 ring-sky-600/20', warning: 'bg-amber-50 text-amber-700 ring-amber-600/20', critical: 'bg-red-50 text-red-700 ring-red-600/20' };
  const actionTiles = [
    { key: 'openPo', label: 'ต้องเปิด PO', count: actionRequired.openPo, level: actionRequired.openPo > 0 ? 'warning' : 'info' },
    { key: 'pendingApproval', label: 'PO รออนุมัติ', count: actionRequired.pendingApproval, level: 'info' },
    { key: 'pendingSend', label: 'PO รอส่ง Supplier', count: actionRequired.pendingSendToSupplier, level: 'info' },
    { key: 'dueSoon', label: 'PO ใกล้ครบกำหนด (3 วัน)', count: actionRequired.dueSoon, level: actionRequired.dueSoon > 0 ? 'warning' : 'info' },
    { key: 'overdue', label: 'PO Overdue', count: actionRequired.overduePo, level: actionRequired.overduePo > 0 ? 'critical' : 'info' },
    { key: 'risk', label: 'Material เสี่ยงขาด', count: actionRequired.materialAtRisk, level: actionRequired.materialAtRisk > 0 ? 'critical' : 'info' },
  ];
  return (
    <div>
      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">{kpiTiles.map((k) => <KpiCard key={k.label} {...k} />)}</div>
      <div className="mt-6">
        <h3 className="text-sm font-semibold text-slate-700">Action Required</h3>
        <div className="mt-2 grid grid-cols-2 gap-3 sm:grid-cols-3">
          {actionTiles.map((a) => (
            <div key={a.key} className="flex items-center justify-between rounded-xl border border-slate-200 bg-white px-4 py-3.5 shadow-sm">
              <span className="text-sm font-medium text-slate-700">{a.label}</span>
              <span className={`font-display rounded-full px-2.5 py-1 text-sm font-semibold ring-1 ring-inset ${LEVEL_STYLE[a.level]}`}>{a.count}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="mt-6">
        <h3 className="text-sm font-semibold text-slate-700">Material เสี่ยงขาด (ต่ำกว่า Safety Stock)</h3>
        <div className="mt-2 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-slate-100 bg-slate-50/60 text-left text-xs font-medium uppercase tracking-wide text-slate-500"><th className="px-4 py-3">Material</th><th className="px-4 py-3 text-right">Stock</th><th className="px-4 py-3 text-right">Safety Stock</th><th className="px-4 py-3">สถานะ</th></tr></thead>
            <tbody>
              {materialsBelowSafety.length === 0 && <tr><td colSpan={4} className="px-4 py-6 text-center text-sm text-slate-400">ไม่มี Material ต่ำกว่า Safety Stock ในขณะนี้</td></tr>}
              {materialsBelowSafety.map((m) => (
                <tr key={m.materialId} className="border-b border-slate-50 last:border-0">
                  <td className="px-4 py-3 font-medium text-slate-800">{m.name}</td>
                  <td className="px-4 py-3 text-right tabular">{m.stock}</td>
                  <td className="px-4 py-3 text-right tabular text-slate-500">{m.safetyStock}</td>
                  <td className="px-4 py-3"><span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset ${LEVEL_STYLE[m.level]}`}><Icon name="alertTriangle" size={11} /> {m.level === 'critical' ? 'Critical' : 'Warning'}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function HBarList({ items, valueFmt = fmtBaht, color = 'bg-slate-500', emptyText = 'ยังไม่มีข้อมูล' }) {
  if (!items || items.length === 0) return <div className="rounded-xl border border-dashed border-slate-200 bg-white px-4 py-6 text-center text-xs text-slate-400">{emptyText}</div>;
  const max = Math.max(...items.map((d) => d.value), 1);
  return (
    <div className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <table className="w-full text-sm">
        <tbody>
          {items.map((d, i) => (
            <tr key={i} className="border-b border-slate-50 last:border-0">
              <td className="w-8 px-4 py-2.5 text-xs text-slate-400">{i + 1}</td>
              <td className="px-2 py-2.5">
                <div className="flex items-center justify-between text-sm"><span className="font-medium text-slate-800">{d.label}</span><span className="tabular text-slate-500">{valueFmt(d.value)}</span></div>
                <div className="mt-1 h-1 w-full overflow-hidden rounded-full bg-slate-100"><div className={`h-full rounded-full ${color}`} style={{ width: `${(d.value / max) * 100}%` }} /></div>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function MonthlyBars({ data, keys, colors, height = 160 }) {
  if (!data || data.length === 0) return <div className="flex items-center justify-center text-xs text-slate-300" style={{ height }}>ยังไม่มีข้อมูล</div>;
  const max = Math.max(...data.flatMap((d) => keys.map((k) => d[k] || 0)), 1);
  return (
    <div className="flex items-end gap-3" style={{ height }}>
      {data.map((d, i) => (
        <div key={i} className="flex flex-1 flex-col items-center gap-1">
          <div className="flex h-full w-full items-end gap-0.5">
            {keys.map((k, ki) => (
              <div key={k} className="flex-1 rounded-t" style={{ height: `${((d[k] || 0) / max) * 100}%`, backgroundColor: colors[ki], minHeight: (d[k] || 0) > 0 ? 2 : 0 }} title={`${k}: ${fmtBaht(d[k] || 0)}`} />
            ))}
          </div>
          <span className="text-[10px] text-slate-400">{d.month}</span>
        </div>
      ))}
    </div>
  );
}

function ChartCard({ title, children }) {
  return (
    <div className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <h3 className="mb-2 text-sm font-semibold text-slate-700">{title}</h3>
      {children}
    </div>
  );
}

function ForecastTab({ store, refresh }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const [formOpen, setFormOpen] = useState(false);
  const [formProduct, setFormProduct] = useState('');
  const [formQty, setFormQty] = useState('');
  const [formNote, setFormNote] = useState('');
  const [adjOpenFor, setAdjOpenFor] = useState(null);
  const [adjQty, setAdjQty] = useState('');
  const [adjChannel, setAdjChannel] = useState('');

  const products = store.products;
  const entries = store.listForecast(year, month);
  const finishedProducts = Object.entries(products).filter(([, p]) => p.type === 'FINISHED');

  useEffect(() => { if (!formProduct && finishedProducts.length) setFormProduct(finishedProducts[0][0]); }, [products]);

  function submitForecast() {
    const qty = Number(formQty);
    if (!qty || qty <= 0) return;
    store.upsertForecast({ year, month, productId: formProduct, quantity: qty, note: formNote, enteredBy: 'purchasing' });
    setFormQty(''); setFormNote(''); setFormOpen(false);
    refresh();
  }

  function submitAdjustment(productId) {
    const qty = Number(adjQty);
    if (!qty || qty <= 0) return;
    store.addForecastAdjustment({ year, month, productId, additionalQty: qty, customerChannel: adjChannel, enteredBy: 'purchasing' });
    setAdjQty(''); setAdjChannel(''); setAdjOpenFor(null);
    refresh();
  }

  return (
    <div>
      <PageHeader title="Forecast ประจำเดือน" year={year} month={month} onYear={setYear} onMonth={setMonth} />
      <div className="mt-6 flex items-center justify-between">
        <p className="text-sm text-slate-500">ระบบเก็บ Version ทุกครั้งที่แก้ไข Forecast ไม่ทับของเดิม</p>
        <button onClick={() => setFormOpen((v) => !v)} className="inline-flex items-center gap-1.5 rounded-lg bg-slate-900 px-3.5 py-2 text-sm font-medium text-white transition hover:bg-slate-700"><Icon name="plus" size={16} /> เพิ่ม / แก้ไข Forecast</button>
      </div>
      {formOpen && (
        <div className="mt-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <div className="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div><label className="text-xs font-medium text-slate-500">Product</label>
              <select value={formProduct} onChange={(e) => setFormProduct(e.target.value)} className="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
                {finishedProducts.map(([id, p]) => <option key={id} value={id}>{p.name}</option>)}
              </select>
            </div>
            <div><label className="text-xs font-medium text-slate-500">Forecast Quantity</label>
              <input type="number" value={formQty} onChange={(e) => setFormQty(e.target.value)} placeholder="เช่น 10000" className="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm tabular outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" />
            </div>
            <div><label className="text-xs font-medium text-slate-500">หมายเหตุ</label>
              <input value={formNote} onChange={(e) => setFormNote(e.target.value)} placeholder="ไม่บังคับ" className="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" />
            </div>
          </div>
          <div className="mt-4 flex justify-end gap-2">
            <button onClick={() => setFormOpen(false)} className="rounded-lg px-3.5 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100">ยกเลิก</button>
            <button onClick={submitForecast} className="rounded-lg bg-amber-600 px-3.5 py-2 text-sm font-medium text-white hover:bg-amber-700">บันทึก Forecast</button>
          </div>
        </div>
      )}
      <div className="mt-6 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <table className="w-full text-sm">
          <thead><tr className="border-b border-slate-100 bg-slate-50/60 text-left text-xs font-medium uppercase tracking-wide text-slate-500"><th className="px-5 py-3">Product</th><th className="px-5 py-3 text-right">Forecast ปัจจุบัน</th><th className="px-5 py-3 text-right">เดิม</th><th className="px-5 py-3 text-right">เพิ่มระหว่างเดือน</th><th className="px-5 py-3">Version</th><th className="px-5 py-3"></th></tr></thead>
          <tbody>
            {entries.length === 0 && <tr><td colSpan={6} className="px-5 py-8 text-center text-sm text-slate-400">ยังไม่มี Forecast ของเดือนนี้</td></tr>}
            {entries.map((entry) => {
              const revisions = entry.revisions;
              const cur = revisions[revisions.length - 1].quantity;
              const prev = revisions.length > 1 ? revisions[revisions.length - 2].quantity : null;
              const adjTotal = entry.adjustments.reduce((s, a) => s + a.additionalQty, 0);
              return (
                <Fragment key={entry.productId}>
                  <tr className="border-b border-slate-50 last:border-0">
                    <td className="px-5 py-4 font-medium text-slate-800">{products[entry.productId]?.name}</td>
                    <td className="px-5 py-4 text-right tabular font-medium">{fmt(cur)}</td>
                    <td className="px-5 py-4 text-right tabular text-slate-400">{prev !== null ? fmt(prev) : '—'}</td>
                    <td className="px-5 py-4 text-right tabular text-emerald-600">{adjTotal > 0 ? `+${fmt(adjTotal)}` : '—'}</td>
                    <td className="px-5 py-4"><span className="inline-flex items-center gap-1 rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-500"><Icon name="history" size={11} /> v{revisions.length}</span></td>
                    <td className="px-5 py-4 text-right"><button onClick={() => setAdjOpenFor(adjOpenFor === entry.productId ? null : entry.productId)} className="inline-flex items-center gap-1 text-xs font-medium text-amber-700 hover:text-amber-800"><Icon name="packagePlus" size={13} /> เพิ่มระหว่างเดือน</button></td>
                  </tr>
                  {adjOpenFor === entry.productId && (
                    <tr className="bg-amber-50/40"><td colSpan={6} className="px-5 py-4">
                      <div className="flex flex-wrap items-end gap-3">
                        <div><label className="text-xs font-medium text-slate-500">จำนวน Order เพิ่ม</label><input type="number" value={adjQty} onChange={(e) => setAdjQty(e.target.value)} className="mt-1 block w-32 rounded-lg border border-slate-200 px-3 py-1.5 text-sm tabular outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" /></div>
                        <div><label className="text-xs font-medium text-slate-500">ลูกค้า / ช่องทาง</label><input value={adjChannel} onChange={(e) => setAdjChannel(e.target.value)} placeholder="เช่น Modern Trade" className="mt-1 block w-48 rounded-lg border border-slate-200 px-3 py-1.5 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" /></div>
                        <button onClick={() => submitAdjustment(entry.productId)} className="rounded-lg bg-slate-900 px-3.5 py-1.5 text-sm font-medium text-white hover:bg-slate-700">บันทึก</button>
                        <button onClick={() => setAdjOpenFor(null)} className="rounded-lg px-3.5 py-1.5 text-sm font-medium text-slate-500 hover:bg-slate-100">ยกเลิก</button>
                      </div>
                    </td></tr>
                  )}
                </Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function MrpTab({ store }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const [mrpResult, setMrpResult] = useState(null);
  const [calculatedAt, setCalculatedAt] = useState(null);
  const [error, setError] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [actualPurchase, setActualPurchase] = useState({});

  const products = store.products;
  const materials = store.materials;

  function nameOf(type, id) { return type === 'SEMI_FINISHED' ? (products[id]?.name || id) : (materials[id]?.name || id); }

  function runMRP() {
    setError(null); setMrpResult(null);
    try {
      const asOfDate = `${year}-${String(month).padStart(2, '0')}-15`;
      const result = store.calculateMrpForPeriod(year, month, asOfDate);
      setMrpResult(result); setCalculatedAt(new Date());
    } catch (e) { setError(e); }
  }

  const kpis = useMemo(() => {
    if (!mrpResult) return null;
    const all = [...mrpResult.base, ...mrpResult.incremental];
    const toOrder = all.filter((r) => r.netRequirement > 0);
    const value = toOrder.reduce((s, r) => s + r.requirementValue, 0);
    const risky = toOrder.filter((r) => { const a = actualPurchase[r.type + r.id]; return a !== undefined && a !== '' && Number(a) < r.netRequirement; });
    return { count: toOrder.length, value, risky: risky.length };
  }, [mrpResult, actualPurchase]);

  return (
    <div>
      <PageHeader title="MRP / รายการที่ต้องสั่งซื้อ" year={year} month={month} onYear={setYear} onMonth={setMonth} />
      <div className="mt-6 flex items-center justify-between">
        <p className="text-sm text-slate-500">{calculatedAt ? `คำนวณล่าสุด ${calculatedAt.toLocaleTimeString('th-TH')}` : 'กด "คำนวณ MRP" เพื่อ Explode BOM จาก Forecast ของเดือนนี้'}</p>
        <button onClick={runMRP} className="inline-flex items-center gap-1.5 rounded-lg bg-amber-600 px-3.5 py-2 text-sm font-medium text-white transition hover:bg-amber-700"><Icon name="calculator" size={16} /> คำนวณ MRP</button>
      </div>
      {error && <div className="mt-4"><ErrorBox message={error.message} onRetry={runMRP} /></div>}
      {kpis && (
        <div className="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-3">
          <KpiCard label="รายการที่ต้องสั่ง/ผลิต" value={kpis.count} suffix="รายการ" />
          <KpiCard label="มูลค่าที่ต้องสั่งเพิ่ม" value={fmtBaht(kpis.value)} />
          <KpiCard label="สั่งจริงน้อยกว่า Net Requirement" value={kpis.risky} suffix="รายการ" tone={kpis.risky > 0 ? 'critical' : 'ok'} />
        </div>
      )}
      {mrpResult && (
        <>
          <MrpTable title="MRP หลัก (จาก Forecast ประจำเดือน)" rows={mrpResult.base} nameOf={nameOf} expanded={expanded} setExpanded={setExpanded} actualPurchase={actualPurchase} setActualPurchase={setActualPurchase} />
          {mrpResult.incremental.length > 0 && <MrpTable title="MRP ส่วนเพิ่มระหว่างเดือน (Adjustment — แยกจากยอดหลัก ไม่ปนกัน)" rows={mrpResult.incremental} nameOf={nameOf} expanded={expanded} setExpanded={setExpanded} actualPurchase={actualPurchase} setActualPurchase={setActualPurchase} keyPrefix="inc-" />}
        </>
      )}
    </div>
  );
}

function MrpTable({ title, rows, nameOf, expanded, setExpanded, actualPurchase, setActualPurchase, keyPrefix = '' }) {
  return (
    <div className="mt-6">
      <h3 className="text-sm font-semibold text-slate-700">{title}</h3>
      <div className="mt-2 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <table className="w-full text-sm">
          <thead><tr className="border-b border-slate-100 bg-slate-50/60 text-left text-xs font-medium uppercase tracking-wide text-slate-500"><th className="px-4 py-3">Material</th><th className="px-4 py-3 text-right">Gross</th><th className="px-4 py-3 text-right">Stock</th><th className="px-4 py-3 text-right">Open PO</th><th className="px-4 py-3 text-right">Safety Stock</th><th className="px-4 py-3 text-right">Net Requirement</th><th className="px-4 py-3 text-right">สั่งจริง</th><th className="px-4 py-3">สถานะ</th></tr></thead>
          <tbody>
            {rows.map((r) => {
              const rowKey = keyPrefix + r.type + r.id;
              const isOpen = expanded === rowKey;
              const actual = actualPurchase[rowKey];
              const short = actual !== undefined && actual !== '' && Number(actual) < r.netRequirement;
              return (
                <Fragment key={rowKey}>
                  <tr className="cursor-pointer border-b border-slate-50 last:border-0 hover:bg-slate-50/60" onClick={() => setExpanded(isOpen ? null : rowKey)}>
                    <td className="px-4 py-3"><div className="flex items-center gap-1.5"><Icon name={isOpen ? 'chevronDown' : 'chevronRight'} size={14} className="text-slate-400" /><div><div className="font-medium text-slate-800">{nameOf(r.type, r.id)}</div><TypeTag type={r.type} /></div></div></td>
                    <td className="px-4 py-3 text-right tabular">{fmt(r.grossRequirement)} {r.unit}</td>
                    <td className="px-4 py-3 text-right tabular text-slate-500">{fmt(r.currentStock)}</td>
                    <td className="px-4 py-3 text-right tabular text-slate-500">{fmt(r.openQty)}</td>
                    <td className="px-4 py-3 text-right tabular text-slate-500">{fmt(r.safetyStock)}</td>
                    <td className="px-4 py-3 text-right tabular font-semibold text-slate-900">{fmt(r.netRequirement)}</td>
                    <td className="px-4 py-3 text-right" onClick={(e) => e.stopPropagation()}>
                      <input type="number" value={actual ?? ''} onChange={(e) => setActualPurchase((prev) => ({ ...prev, [rowKey]: e.target.value }))} placeholder={r.netRequirement > 0 ? String(r.netRequirement) : '0'} className={`w-24 rounded-lg border px-2 py-1 text-right text-sm tabular outline-none ${short ? 'border-red-300 bg-red-50 text-red-700' : 'border-slate-200 focus:border-amber-500 focus:ring-1 focus:ring-amber-500'}`} />
                    </td>
                    <td className="px-4 py-3"><StatusBadge status={r.status} /></td>
                  </tr>
                  {isOpen && (
                    <tr className="bg-slate-50/40"><td colSpan={8} className="px-4 py-3">
                      <div className="rounded-lg border border-dashed border-slate-300 bg-white p-3">
                        <p className="mb-2 text-[11px] font-semibold uppercase tracking-wide text-slate-400">ที่มาของ Requirement (Drill Down)</p>
                        <ul className="space-y-1 text-xs text-slate-600">
                          {r.breakdown.map((b, i) => <li key={i} className="flex justify-between border-b border-dashed border-slate-100 py-1 tabular last:border-0"><span>{b.source.path.map((p) => nameOf('SEMI_FINISHED', p)).join(' → ')}</span><span className="font-medium">{fmt(b.qty)} {r.unit}</span></li>)}
                        </ul>
                        {r.purchaseQtyNeeded > 0 && <p className="mt-2 text-xs text-slate-500">ต้องสั่งซื้อ ≈ <span className="font-semibold text-slate-800">{r.purchaseQtyNeeded}</span> หน่วยซื้อ</p>}
                      </div>
                    </td></tr>
                  )}
                </Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================================
   TAB: BOM
   ============================================================================ */

function BomTab({ store, refresh }) {
  const products = store.products;
  const materials = store.materials;
  const [selectedProduct, setSelectedProduct] = useState(Object.keys(products)[0] || null);
  const [tab, setTab] = useState('master');
  const [search, setSearch] = useState('');
  const [addingProduct, setAddingProduct] = useState(false);
  const [newProductId, setNewProductId] = useState('');
  const [newProductName, setNewProductName] = useState('');
  const [newProductType, setNewProductType] = useState('FINISHED');
  const [productError, setProductError] = useState(null);
  const [deleteError, setDeleteError] = useState(null);

  function submitNewProduct() {
    if (!newProductName.trim()) return;
    setProductError(null);
    try {
      const created = store.createProduct({ productId: newProductId.trim() || undefined, name: newProductName.trim(), type: newProductType });
      setSelectedProduct(created.productId);
      setTab('master');
      setNewProductId(''); setNewProductName(''); setNewProductType('FINISHED'); setAddingProduct(false);
      refresh();
    } catch (e) { setProductError(e.message); }
  }

  function handleDeleteProduct() {
    setDeleteError(null);
    if (!window.confirm(`ยืนยันลบสินค้า "${products[selectedProduct].name}" พร้อม BOM ทั้งหมดของมัน? การลบนี้ย้อนกลับไม่ได้`)) return;
    try {
      store.deleteProduct(selectedProduct);
      const remainingIds = Object.keys(products);
      setSelectedProduct(remainingIds.length ? remainingIds[0] : null);
      refresh();
    } catch (e) { setDeleteError(e.message); }
  }

  const filtered = Object.entries(products).filter(([, p]) => search === '' || p.name.includes(search));

  return (
    <div>
      <p className="font-display text-[11px] font-semibold uppercase tracking-[0.2em] text-amber-700">Bakery Purchasing · BOM</p>
      <h1 className="font-display mt-1 text-2xl font-semibold text-slate-900">BOM Master / Tree / Where Used</h1>
      <div className="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-[280px_1fr]">
        <div>
          <div className="relative"><Icon name="search" size={14} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="ค้นหา Product..." className="w-full rounded-lg border border-slate-200 bg-white py-2 pl-8 pr-3 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" />
          </div>
          <div className="mt-3">
            {!addingProduct ? (
              <button onClick={() => setAddingProduct(true)} className="inline-flex w-full items-center justify-center gap-1.5 rounded-lg border border-dashed border-amber-300 px-3 py-2 text-xs font-medium text-amber-700 hover:bg-amber-50"><Icon name="plus" size={14} /> เพิ่มสินค้าใหม่ / BOM ใหม่</button>
            ) : (
              <div className="rounded-lg border border-slate-200 bg-slate-50 p-2.5">
                <select value={newProductType} onChange={(e) => setNewProductType(e.target.value)} className="w-full rounded-lg border border-slate-200 px-2 py-1.5 text-xs outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
                  <option value="FINISHED">Finished Product</option>
                  <option value="SEMI_FINISHED">Semi-Finished</option>
                </select>
                <input value={newProductId} onChange={(e) => setNewProductId(e.target.value)} placeholder="รหัสสินค้า (ไม่กรอก = สร้างอัตโนมัติ)" className="mt-2 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-xs outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" />
                <input value={newProductName} onChange={(e) => setNewProductName(e.target.value)} placeholder="ชื่อสินค้า" className="mt-2 w-full rounded-lg border border-slate-200 px-2 py-1.5 text-xs outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" />
                {productError && <p className="mt-1.5 text-[11px] text-red-600">{productError}</p>}
                <div className="mt-2 flex justify-end gap-1.5">
                  <button onClick={() => { setAddingProduct(false); setProductError(null); setNewProductId(''); setNewProductName(''); }} className="rounded-lg px-2 py-1 text-[11px] font-medium text-slate-500 hover:bg-slate-100">ยกเลิก</button>
                  <button onClick={submitNewProduct} className="rounded-lg bg-slate-900 px-2 py-1 text-[11px] font-medium text-white hover:bg-slate-700">สร้าง</button>
                </div>
              </div>
            )}
          </div>
          <p className="mb-1.5 mt-4 px-1 text-[11px] font-semibold uppercase tracking-wide text-slate-400">Finished Product</p>
          <div className="space-y-1">
            {filtered.filter(([, p]) => p.type === 'FINISHED').map(([id, p]) => (
              <button key={id} onClick={() => { setSelectedProduct(id); setTab('master'); }} className={`block w-full rounded-lg px-3 py-2 text-left text-sm transition ${selectedProduct === id ? 'bg-slate-900 font-medium text-white' : 'text-slate-600 hover:bg-slate-100'}`}>{p.name}</button>
            ))}
          </div>
          <p className="mb-1.5 mt-4 px-1 text-[11px] font-semibold uppercase tracking-wide text-slate-400">Semi-Finished</p>
          <div className="space-y-1">
            {filtered.filter(([, p]) => p.type === 'SEMI_FINISHED').map(([id, p]) => (
              <button key={id} onClick={() => { setSelectedProduct(id); setTab('master'); }} className={`block w-full rounded-lg px-3 py-2 text-left text-sm transition ${selectedProduct === id ? 'bg-slate-900 font-medium text-white' : 'text-slate-600 hover:bg-slate-100'}`}>{p.name}</button>
            ))}
          </div>
        </div>
        <main className="min-w-0 flex-1">
          {!selectedProduct ? (
            <div className="rounded-xl border border-slate-200 bg-white p-6 text-sm text-slate-400">ยังไม่มีสินค้าในระบบ — กด "เพิ่มสินค้าใหม่ / BOM ใหม่" ทางซ้ายเพื่อเริ่มต้น</div>
          ) : (
            <>
              <div className="flex items-start justify-between gap-3">
                <div><h2 className="font-display text-xl font-semibold text-slate-900">{products[selectedProduct].name}</h2><p className="text-xs text-slate-400">{selectedProduct} · {products[selectedProduct].type === 'FINISHED' ? 'Finished' : 'กึ่งสำเร็จรูป'}</p></div>
                <button onClick={handleDeleteProduct} title="ลบสินค้านี้" className="inline-flex shrink-0 items-center gap-1.5 rounded-lg border border-red-200 px-2.5 py-1.5 text-xs font-medium text-red-600 hover:bg-red-50"><Icon name="trash" size={13} /> ลบสินค้า</button>
              </div>
              {deleteError && <div className="mt-2 flex items-start gap-2 rounded-lg bg-red-50 px-3 py-2 text-xs text-red-700"><Icon name="alertTriangle" size={14} className="mt-0.5 shrink-0" /> {deleteError}</div>}
              <nav className="mt-4 flex gap-6 border-b border-slate-200 text-sm">
                {[['master', 'BOM Master'], ['tree', 'BOM Tree'], ['whereused', 'Where Used']].map(([key, label]) => (
                  <button key={key} onClick={() => setTab(key)} className={`relative pb-3 font-medium transition-colors ${tab === key ? 'text-slate-900' : 'text-slate-400 hover:text-slate-600'}`}>{label}{tab === key && <span className="absolute inset-x-0 -bottom-px h-0.5 rounded-full bg-amber-600" />}</button>
                ))}
              </nav>
              <div className="mt-4">
                {tab === 'master' && <BomMaster key={selectedProduct} productId={selectedProduct} products={products} materials={materials} store={store} refresh={refresh} />}
                {tab === 'tree' && <BomTreeView key={selectedProduct} productId={selectedProduct} store={store} />}
                {tab === 'whereused' && <WhereUsed productId={selectedProduct} productType={products[selectedProduct].type} products={products} store={store} jumpTo={(pid) => { setSelectedProduct(pid); setTab('master'); }} />}
              </div>
            </>
          )}
        </main>
      </div>
    </div>
  );
}

function blankBomRow() {
  return { key: 'r' + Math.random().toString(36).slice(2, 9), type: 'RAW_MATERIAL', id: '', qty: '', loss: '0', yield: '100' };
}

function BomMaster({ productId, products, materials, store, refresh }) {
  const [adding, setAdding] = useState(false);
  const [rows, setRows] = useState([blankBomRow()]);
  const [submitError, setSubmitError] = useState(null);

  const tree = store.getBomTree(productId, TODAY) || { productId, productName: products[productId]?.name || productId, version: null, components: [] };

  const totalsByUnit = useMemo(() => {
    const map = {};
    tree.components.forEach((c) => { map[c.unit] = (map[c.unit] || 0) + Number(c.quantity || 0); });
    return Object.entries(map);
  }, [tree.components]);

  function optionsFor(type) {
    if (type === 'SEMI_FINISHED') return Object.entries(products).filter(([id, p]) => p.type === 'SEMI_FINISHED' && id !== productId);
    return Object.entries(materials).filter(([, m]) => m.type === type);
  }

  function updateRow(key, patch) {
    setRows((rs) => rs.map((r) => (r.key === key ? { ...r, ...patch } : r)));
  }
  function addRow() {
    setRows((rs) => [...rs, blankBomRow()]);
  }
  function removeRow(key) {
    setRows((rs) => (rs.length === 1 ? rs : rs.filter((r) => r.key !== key)));
  }
  function startAdding() {
    setRows([blankBomRow()]);
    setSubmitError(null);
    setAdding(true);
  }
  function cancelAdding() {
    setAdding(false);
    setSubmitError(null);
    setRows([blankBomRow()]);
  }

  function submitAll() {
    const emptyRow = rows.find((r) => !r.id || r.qty === '' || r.qty === null);
    if (emptyRow) { setSubmitError('กรุณาเลือกรายการและระบุจำนวนให้ครบทุกแถว'); return; }
    setSubmitError(null);
    try {
      rows.forEach((r) => {
        const unit = r.type === 'SEMI_FINISHED' ? 'ชิ้น' : (materials[r.id]?.unit || 'kg');
        store.addBomDetail(productId, { componentType: r.type, componentId: r.id, quantity: Number(r.qty), unit, lossPct: Number(r.loss), yieldPct: Number(r.yield) }, TODAY);
      });
      setRows([blankBomRow()]);
      setAdding(false);
      refresh();
    } catch (e) { setSubmitError(e.message); }
  }

  function removeComponent(bomDetailId) {
    try { store.removeBomDetail(productId, bomDetailId); refresh(); } catch (e) { setSubmitError(e.message); }
  }

  return (
    <div>
      <div className="flex flex-wrap items-center gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-sm">
        <span className="inline-flex items-center gap-1 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600">{tree.version || 'ยังไม่มี BOM'}</span>
        <span className="text-xs text-slate-400">ณ {TODAY}</span>
      </div>
      <div className="mt-4 overflow-hidden rounded-t-xl border border-b-0 border-slate-200 bg-white shadow-sm">
        <table className="w-full text-sm">
          <thead><tr className="border-b border-slate-100 bg-slate-50/60 text-left text-xs font-medium uppercase tracking-wide text-slate-500"><th className="px-4 py-3">Component</th><th className="px-4 py-3 text-right">Quantity</th><th className="px-4 py-3">Unit</th><th className="px-4 py-3 text-right">Loss %</th><th className="px-4 py-3 text-right">Yield %</th><th className="px-4 py-3"></th></tr></thead>
          <tbody>
            {tree.components.length === 0 && <tr><td colSpan={6} className="px-4 py-6 text-center text-sm text-slate-400">ยังไม่มี Component</td></tr>}
            {tree.components.map((c) => (
              <tr key={c.bomDetailId} className="border-b border-slate-50 last:border-0">
                <td className="px-4 py-3"><div className="flex items-center gap-2"><TypeTag type={c.componentType} /><span className="font-medium text-slate-800">{c.name}</span></div></td>
                <td className="px-4 py-3 text-right tabular">{fmt(c.quantity)}</td>
                <td className="px-4 py-3 text-slate-500">{c.unit}</td>
                <td className="px-4 py-3 text-right tabular text-slate-500">{c.lossPct}%</td>
                <td className="px-4 py-3 text-right tabular text-slate-500">{c.yieldPct}%</td>
                <td className="px-4 py-3"><button onClick={() => removeComponent(c.bomDetailId)} className="text-slate-300 hover:text-red-500"><Icon name="trash" size={14} /></button></td>
              </tr>
            ))}
          </tbody>
          {tree.components.length > 0 && (
            <tfoot>
              <tr className="border-t-2 border-slate-200 bg-slate-50/80 text-slate-700">
                <td className="px-4 py-3 font-semibold">รวมน้ำหนักสุทธิ Batch</td>
                <td className="px-4 py-3 text-right tabular font-semibold">
                  {totalsByUnit.map(([u, v]) => (<div key={u}>{fmt(v)}</div>))}
                </td>
                <td className="px-4 py-3 font-medium text-slate-500">
                  {totalsByUnit.map(([u]) => (<div key={u}>{u}</div>))}
                </td>
                <td className="px-4 py-3" colSpan={3}></td>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
      <div className="rounded-b-xl border border-t-0 border-slate-200 bg-white p-4 shadow-sm">
        {!adding ? (
          <button onClick={startAdding} className="inline-flex items-center gap-1.5 text-sm font-medium text-amber-700 hover:text-amber-800"><Icon name="plus" size={14} /> เพิ่ม Component</button>
        ) : (
          <div className="flex flex-col gap-3">
            {rows.map((r, idx) => (
              <div key={r.key} className="flex flex-wrap items-end gap-2 border-b border-slate-50 pb-3 last:border-0 last:pb-0">
                <div><label className="text-xs text-slate-500">ประเภท</label>
                  <select value={r.type} onChange={(e) => updateRow(r.key, { type: e.target.value, id: '' })} className="mt-1 block w-32 rounded-lg border border-slate-200 px-2 py-1.5 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
                    <option value="RAW_MATERIAL">วัตถุดิบ</option><option value="PACKAGING">บรรจุภัณฑ์</option><option value="SEMI_FINISHED">กึ่งสำเร็จรูป</option>
                  </select>
                </div>
                <div className="w-72"><label className="text-xs text-slate-500">รายการ</label>
                  <div className="mt-1">
                    <SearchableSelect
                      options={optionsFor(r.type).map(([id, o]) => [id, `${id} — ${o.name}`])}
                      value={r.id}
                      onChange={(id) => updateRow(r.key, { id })}
                      placeholder="พิมพ์ค้นหารหัส/ชื่อ..."
                    />
                  </div>
                </div>
                <div><label className="text-xs text-slate-500">จำนวน</label><input type="number" value={r.qty} onChange={(e) => updateRow(r.key, { qty: e.target.value })} className="mt-1 block w-24 rounded-lg border border-slate-200 px-2 py-1.5 text-sm tabular outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" /></div>
                <div><label className="text-xs text-slate-500">Loss %</label><input type="number" value={r.loss} onChange={(e) => updateRow(r.key, { loss: e.target.value })} className="mt-1 block w-20 rounded-lg border border-slate-200 px-2 py-1.5 text-sm tabular outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" /></div>
                <div><label className="text-xs text-slate-500">Yield %</label><input type="number" value={r.yield} onChange={(e) => updateRow(r.key, { yield: e.target.value })} className="mt-1 block w-20 rounded-lg border border-slate-200 px-2 py-1.5 text-sm tabular outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" /></div>
                <button onClick={() => removeRow(r.key)} disabled={rows.length === 1} className="rounded-lg px-2 py-1.5 text-slate-300 hover:text-red-500 disabled:cursor-not-allowed disabled:opacity-40" title="ลบแถวนี้"><Icon name="trash" size={14} /></button>
              </div>
            ))}
            <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
              <button onClick={addRow} className="inline-flex items-center gap-1.5 text-sm font-medium text-amber-700 hover:text-amber-800"><Icon name="plus" size={14} /> เพิ่มแถว</button>
              <div className="flex items-center gap-2">
                <button onClick={cancelAdding} className="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-500 hover:bg-slate-100">ยกเลิก</button>
                <button onClick={submitAll} className="rounded-lg bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700">บันทึก ({rows.length})</button>
              </div>
            </div>
          </div>
        )}
        {submitError && <p className="mt-2 text-xs text-red-600">{submitError}</p>}
      </div>
    </div>
  );
}

function BomTreeNode({ node, depth = 0 }) {
  if (!node) return null;
  return (
    <div style={{ marginLeft: depth * 20 }}>
      <div className="flex items-center gap-2 border-l-2 border-slate-100 py-1.5 pl-3">
        <span className="text-sm font-medium text-slate-800">{node.productName}</span>
        <span className="text-xs text-slate-400">{node.version}</span>
      </div>
      {node.components.map((c) => (
        <div key={c.bomDetailId} style={{ marginLeft: (depth + 1) * 20 }} className="border-l-2 border-slate-100 py-1 pl-3">
          <div className="flex items-center gap-2 text-sm"><TypeTag type={c.componentType} /><span className="text-slate-700">{c.name}</span><span className="tabular text-xs text-slate-400">{fmt(c.quantity)} {c.unit}</span></div>
          {c.children && <BomTreeNode node={c.children} depth={depth + 2} />}
        </div>
      ))}
    </div>
  );
}

function BomTreeView({ productId, store }) {
  const tree = store.getBomTree(productId, TODAY);
  if (!tree) return <div className="rounded-xl border border-dashed border-slate-200 bg-white p-8 text-center text-sm text-slate-400">ยังไม่มี BOM สำหรับสินค้านี้</div>;
  return <div className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"><BomTreeNode node={tree} /></div>;
}

function WhereUsed({ productId, productType, products, store, jumpTo }) {
  const usedIn = store.whereUsed(productType === 'FINISHED' ? 'SEMI_FINISHED' : productType, productId);
  const asComponent = store.whereUsed('SEMI_FINISHED', productId);
  const list = productType === 'SEMI_FINISHED' ? asComponent : usedIn;
  return (
    <div className="rounded-xl border border-slate-200 bg-white shadow-sm">
      {list.length === 0 ? (
        <div className="p-8 text-center text-sm text-slate-400">ไม่ถูกใช้เป็น Component ในสินค้าอื่น</div>
      ) : (
        <ul className="divide-y divide-slate-50">
          {list.map((u) => (
            <li key={u.productId}><button onClick={() => jumpTo(u.productId)} className="flex w-full items-center justify-between px-4 py-3 text-left text-sm hover:bg-slate-50"><span className="font-medium text-slate-800">{u.productName}</span><Icon name="chevronRight" size={14} className="text-slate-300" /></button></li>
          ))}
        </ul>
      )}
    </div>
  );
}
