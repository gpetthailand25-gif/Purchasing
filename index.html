function PoTab({ store, refresh }) {
  const [creating, setCreating] = useState(false);
  const [expandedPoId, setExpandedPoId] = useState(null);

  const suppliers = store.suppliers;
  const materials = store.materials;
  const pos = store.listPurchaseOrdersTracking();

  if (creating) return <CreatePoForm store={store} suppliers={suppliers} materials={materials} onDone={() => { setCreating(false); refresh(); }} onCancel={() => setCreating(false)} />;

  const totalValue = pos.reduce((s, po) => s + po.lines.reduce((ls, l) => ls + l.orderedQty * l.unitPrice, 0), 0);
  const outstandingValue = pos.reduce((s, po) => s + po.lines.reduce((ls, l) => ls + l.outstanding * l.unitPrice, 0), 0);
  const overdueCount = pos.filter((po) => po.isOverdue).length;

  return (
    <div>
      <div className="flex items-center justify-between">
        <div><p className="font-display text-[11px] font-semibold uppercase tracking-[0.2em] text-amber-700">Bakery Purchasing</p><h1 className="font-display mt-1 text-2xl font-semibold text-slate-900">PO Tracking</h1></div>
        <button onClick={() => setCreating(true)} className="inline-flex items-center gap-1.5 rounded-lg bg-amber-600 px-3.5 py-2 text-sm font-medium text-white hover:bg-amber-700"><Icon name="plus" size={16} /> สร้าง PO</button>
      </div>
      <div className="mt-6 grid grid-cols-1 gap-3 sm:grid-cols-3">
        <KpiCard label="มูลค่า PO ทั้งหมด" value={fmtBaht(totalValue)} />
        <KpiCard label="มูลค่าคงค้าง (Outstanding)" value={fmtBaht(outstandingValue)} />
        <KpiCard label="PO เกินกำหนด (Overdue)" value={overdueCount} suffix="ใบ" tone={overdueCount > 0 ? 'critical' : 'ok'} />
      </div>
      <div className="mt-6 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <table className="w-full text-sm">
          <thead><tr className="border-b border-slate-100 bg-slate-50/60 text-left text-xs font-medium uppercase tracking-wide text-slate-500"><th className="px-4 py-3">PO</th><th className="px-4 py-3">Supplier</th><th className="px-4 py-3 text-right">Ordered</th><th className="px-4 py-3 text-right">Received</th><th className="px-4 py-3 text-right">Outstanding</th><th className="px-4 py-3 text-right">มูลค่า</th><th className="px-4 py-3">กำหนดส่ง</th><th className="px-4 py-3">สถานะ</th></tr></thead>
          <tbody>
            {pos.length === 0 && <tr><td colSpan={8} className="px-4 py-8 text-center text-sm text-slate-400">ยังไม่มี PO</td></tr>}
            {pos.map((po) => {
              const isOpen = expandedPoId === po.poId;
              const totalOrdered = po.lines.reduce((s, l) => s + l.orderedQty, 0);
              const totalReceived = po.lines.reduce((s, l) => s + l.receivedQty, 0);
              const totalOutstanding = po.lines.reduce((s, l) => s + l.outstanding, 0);
              const totalPoValue = po.lines.reduce((s, l) => s + l.orderedQty * l.unitPrice, 0);
              const progress = totalOrdered > 0 ? (totalReceived / totalOrdered) * 100 : 0;
              return (
                <Fragment key={po.poId}>
                  <tr className="cursor-pointer border-b border-slate-50 last:border-0 hover:bg-slate-50/60" onClick={() => setExpandedPoId(isOpen ? null : po.poId)}>
                    <td className="px-4 py-3"><div className="flex items-center gap-1.5 font-medium text-slate-800"><Icon name={isOpen ? 'chevronDown' : 'chevronRight'} size={14} className="text-slate-400" /> {po.poNumber}</div></td>
                    <td className="px-4 py-3 text-slate-600">{suppliers[po.supplierId]?.name}</td>
                    <td className="px-4 py-3 text-right tabular">{fmt(totalOrdered)}</td>
                    <td className="px-4 py-3 text-right tabular">{fmt(totalReceived)}</td>
                    <td className="px-4 py-3 text-right tabular font-medium text-slate-900">{fmt(totalOutstanding)}</td>
                    <td className="px-4 py-3 text-right tabular">{fmtBaht(totalPoValue)}</td>
                    <td className="px-4 py-3"><div className="text-slate-600">{po.expectedDeliveryDate}</div>{po.isOverdue && <div className="mt-0.5 flex items-center gap-1 text-xs font-medium text-red-600"><Icon name="alertTriangle" size={11} /> ล่าช้า {po.delayDays} วัน</div>}</td>
                    <td className="px-4 py-3"><span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset ${STATUS_COLOR[po.status]}`}>{po.status === 'RECEIVED' && <Icon name="checkCircle" size={12} />}{po.isOverdue && po.status !== 'RECEIVED' ? 'Overdue' : STATUS_LABEL[po.status]}</span></td>
                  </tr>
                  {isOpen && (
                    <tr className="bg-slate-50/40"><td colSpan={8} className="px-4 py-4">
                      <div className="rounded-lg border border-slate-200 bg-white p-4">
                        <div className="mb-3 h-1.5 w-full overflow-hidden rounded-full bg-slate-100"><div className={`h-full rounded-full ${progress >= 100 ? 'bg-emerald-500' : 'bg-amber-500'}`} style={{ width: `${Math.min(100, progress)}%` }} /></div>
                        <table className="w-full text-xs">
                          <thead><tr className="text-left text-slate-400"><th className="pb-2">Material</th><th className="pb-2 text-right">Ordered</th><th className="pb-2 text-right">Received</th><th className="pb-2 text-right">Outstanding</th><th className="pb-2">สถานะ</th></tr></thead>
                          <tbody>{po.lines.map((l, i) => <tr key={i} className="border-t border-slate-100"><td className="py-2 font-medium text-slate-700">{materials[l.materialId]?.name}</td><td className="py-2 text-right tabular">{fmt(l.orderedQty)}</td><td className="py-2 text-right tabular">{fmt(l.receivedQty)}</td><td className="py-2 text-right tabular font-medium">{fmt(l.outstanding)}</td><td className="py-2 text-slate-500">{l.status}</td></tr>)}</tbody>
                        </table>
                      </div>
                    </td></tr>
                  )}
                </Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function CreatePoForm({ store, suppliers, materials, onDone, onCancel }) {
  const firstSupplier = Object.keys(suppliers)[0];
  const firstMaterial = Object.keys(materials)[0];
  const [supplierId, setSupplierId] = useState(firstSupplier || '');
  const [expectedDeliveryDate, setExpectedDeliveryDate] = useState('');
  const [lines, setLines] = useState([{ materialId: firstMaterial || '', orderedQty: '', unitPrice: firstMaterial ? materials[firstMaterial].price : '' }]);
  const [submitError, setSubmitError] = useState(null);

  function updateLine(i, patch) { setLines((prev) => prev.map((l, idx) => (idx === i ? { ...l, ...patch } : l))); }
  function addLine() { const fm = Object.keys(materials)[0]; setLines((prev) => [...prev, { materialId: fm, orderedQty: '', unitPrice: materials[fm].price }]); }
  function removeLine(i) { setLines((prev) => prev.filter((_, idx) => idx !== i)); }

  const total = lines.reduce((s, l) => s + (Number(l.orderedQty) || 0) * (Number(l.unitPrice) || 0), 0);
  const canSubmit = expectedDeliveryDate && lines.every((l) => Number(l.orderedQty) > 0);

  function submit() {
    if (!canSubmit) return;
    setSubmitError(null);
    try {
      store.createPurchaseOrder({ supplierId, expectedDeliveryDate, lines: lines.map((l) => ({ materialId: l.materialId, orderedQty: Number(l.orderedQty), unitPrice: Number(l.unitPrice) })) });
      onDone();
    } catch (e) { setSubmitError(e.message); }
  }

  return (
    <div>
      <p className="font-display text-[11px] font-semibold uppercase tracking-[0.2em] text-amber-700">Bakery Purchasing</p>
      <h1 className="font-display mt-1 text-2xl font-semibold text-slate-900">สร้าง Purchase Order</h1>
      <div className="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div><label className="text-xs font-medium text-slate-500">Supplier</label>
            <select value={supplierId} onChange={(e) => setSupplierId(e.target.value)} className="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
              {Object.entries(suppliers).map(([id, s]) => <option key={id} value={id}>{s.name} (Lead Time {s.leadTimeDays} วัน)</option>)}
            </select>
          </div>
          <div><label className="text-xs font-medium text-slate-500">Expected Delivery Date</label><input type="date" value={expectedDeliveryDate} onChange={(e) => setExpectedDeliveryDate(e.target.value)} className="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" /></div>
        </div>
        <div className="mt-5">
          <p className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">รายการวัตถุดิบ</p>
          <div className="space-y-2">
            {lines.map((l, i) => (
              <div key={i} className="flex items-center gap-2 rounded-lg bg-slate-50 p-2.5">
                <select value={l.materialId} onChange={(e) => updateLine(i, { materialId: e.target.value, unitPrice: materials[e.target.value].price })} className="w-40 rounded-lg border border-slate-200 px-2 py-1.5 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
                  {Object.entries(materials).map(([id, m]) => <option key={id} value={id}>{m.name}</option>)}
                </select>
                <input type="number" placeholder="จำนวน" value={l.orderedQty} onChange={(e) => updateLine(i, { orderedQty: e.target.value })} className="w-28 rounded-lg border border-slate-200 px-2 py-1.5 text-sm tabular outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" />
                <span className="text-slate-300">×</span>
                <input type="number" value={l.unitPrice} onChange={(e) => updateLine(i, { unitPrice: e.target.value })} className="w-24 rounded-lg border border-slate-200 px-2 py-1.5 text-sm tabular outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" />
                <span className="ml-auto text-sm tabular font-medium text-slate-700">{fmtBaht((Number(l.orderedQty) || 0) * (Number(l.unitPrice) || 0))}</span>
                {lines.length > 1 && <button onClick={() => removeLine(i)} className="text-slate-300 hover:text-red-500"><Icon name="trash" size={14} /></button>}
              </div>
            ))}
          </div>
          <button onClick={addLine} className="mt-2 inline-flex items-center gap-1.5 text-sm font-medium text-amber-700 hover:text-amber-800"><Icon name="plus" size={14} /> เพิ่มรายการ</button>
        </div>
        {submitError && <div className="mt-4 rounded-lg bg-red-50 px-3 py-2 text-xs text-red-700">{submitError}</div>}
        <div className="mt-5 flex items-center justify-between border-t border-slate-100 pt-4">
          <div className="text-sm text-slate-500">มูลค่ารวม <span className="font-display ml-1 text-lg font-semibold tabular text-slate-900">{fmtBaht(total)}</span></div>
          <div className="flex gap-2">
            <button onClick={onCancel} className="rounded-lg px-3.5 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100">ยกเลิก</button>
            <button onClick={submit} disabled={!canSubmit} className="inline-flex items-center gap-1.5 rounded-lg bg-amber-600 px-4 py-2 text-sm font-medium text-white hover:bg-amber-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400"><Icon name="truck" size={16} /> สร้าง PO</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   TAB: Receiving
   ============================================================================ */

function ReceivingTab({ store, refresh }) {
  const suppliers = store.suppliers;
  const materials = store.materials;
  const pos = store.listPurchaseOrdersTracking();
  const [selectedId, setSelectedId] = useState(null);
  const [amounts, setAmounts] = useState({});
  const today = new Date();

  const receivable = pos.filter((p) => p.status !== 'RECEIVED' && p.status !== 'CANCELLED' && p.status !== 'DRAFT');

  useEffect(() => {
    if (selectedId === null && receivable.length > 0) setSelectedId(receivable[0].poId);
  }, []);

  function submit() {
    const po = pos.find((p) => p.poId === selectedId);
    if (!po) return;
    const nonZero = Object.fromEntries(Object.entries(amounts).filter(([, v]) => Number(v) > 0));
    if (Object.keys(nonZero).length === 0) return;
    const lines = Object.entries(nonZero).map(([materialId, receivedQty]) => ({ materialId, receivedQty: Number(receivedQty) }));
    store.receiveGoods(po.poId, lines);
    setAmounts({});
    refresh();
  }

  const po = pos.find((p) => p.poId === selectedId);

  return (
    <div>
      <p className="font-display text-[11px] font-semibold uppercase tracking-[0.2em] text-amber-700">Bakery Purchasing</p>
      <h1 className="font-display mt-1 text-2xl font-semibold text-slate-900">รับสินค้า (Receiving)</h1>
      {receivable.length === 0 ? (
        <div className="mt-6 rounded-xl border border-slate-200 bg-white p-8 text-center text-sm text-slate-400">ไม่มี PO ที่รอรับสินค้าในขณะนี้</div>
      ) : (
        <div className="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-3">
          <div className="lg:col-span-1">
            <p className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">เลือก PO</p>
            <ul className="space-y-1.5">
              {receivable.map((p) => (
                <li key={p.poId}>
                  <button onClick={() => { setSelectedId(p.poId); setAmounts({}); }} className={`w-full rounded-lg border px-3 py-2.5 text-left text-sm transition ${selectedId === p.poId ? 'border-amber-400 bg-amber-50' : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                    <div className="flex items-center justify-between"><span className="font-medium text-slate-800">{p.poNumber}</span><span className={`rounded-full px-2 py-0.5 text-[10px] font-medium ring-1 ring-inset ${STATUS_COLOR[p.status]}`}>{STATUS_LABEL[p.status]}</span></div>
                    <div className="mt-0.5 text-xs text-slate-400">{suppliers[p.supplierId]?.name}</div>
                  </button>
                </li>
              ))}
            </ul>
          </div>
          <div className="lg:col-span-2">
            {po && (
              <div className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
                <div className="flex items-center justify-between">
                  <div><p className="font-display text-lg font-semibold text-slate-900">{po.poNumber}</p><p className="text-xs text-slate-400">{suppliers[po.supplierId]?.name} · กำหนดส่ง {po.expectedDeliveryDate}</p></div>
                  <div className="flex items-center gap-1.5 text-xs text-slate-400"><Icon name="clock" size={13} /> วันนี้ {today.toISOString().slice(0, 10)}</div>
                </div>
                <div className="mt-4 space-y-3">
                  {po.lines.map((l) => {
                    const progress = (l.receivedQty / l.orderedQty) * 100;
                    return (
                      <div key={l.materialId} className="rounded-lg border border-slate-100 p-3">
                        <div className="flex items-center justify-between text-sm"><span className="font-medium text-slate-800">{materials[l.materialId]?.name}</span><span className="tabular text-slate-500">{fmt(l.receivedQty)} / {fmt(l.orderedQty)}</span></div>
                        <div className="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-slate-100"><div className={`h-full rounded-full ${progress >= 100 ? 'bg-emerald-500' : 'bg-amber-500'}`} style={{ width: `${Math.min(100, progress)}%` }} /></div>
                        {l.outstanding > 0 && (
                          <div className="mt-2 flex items-center gap-2">
                            <label className="text-xs text-slate-500">รับเพิ่มครั้งนี้:</label>
                            <input type="number" max={l.outstanding} value={amounts[l.materialId] ?? ''} onChange={(e) => setAmounts((prev) => ({ ...prev, [l.materialId]: e.target.value }))} placeholder={`สูงสุด ${fmt(l.outstanding)}`} className="w-32 rounded-lg border border-slate-200 px-2 py-1 text-sm tabular outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500" />
                            <span className="text-xs text-slate-400">(ค้างรับ {fmt(l.outstanding)})</span>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
                <button onClick={submit} className="mt-4 inline-flex items-center gap-1.5 rounded-lg bg-amber-600 px-4 py-2 text-sm font-medium text-white hover:bg-amber-700"><Icon name="packageCheck" size={16} /> บันทึกรับสินค้า</button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================================
   APP SHELL
   ============================================================================ */

const TABS = [
  ['dashboard', 'Dashboard', 'layoutDashboard', DashboardTab],
  ['forecast', 'Forecast', 'clipboardList', ForecastTab],
  ['mrp', 'MRP', 'calculator', MrpTab],
  ['bom', 'BOM', 'layers', BomTab],
  ['materials', 'Materials', 'boxes', MaterialsTab],
  ['po', 'PO Tracking', 'truck', PoTab],
  ['receiving', 'Receiving', 'packageCheck', ReceivingTab],
];

function Sidebar({ activeTab, setActiveTab }) {
  return (
    <aside className="w-56 shrink-0 border-r border-slate-200 bg-white px-3 py-5">
      <div className="px-2">
        <p className="font-display text-[10px] font-semibold uppercase tracking-[0.2em] text-amber-700">Bakery</p>
        <p className="font-display text-lg font-semibold text-slate-900">Purchasing · MRP</p>
      </div>
      <nav className="mt-6 space-y-1">
        {TABS.map(([key, label, icon]) => (
          <button key={key} onClick={() => setActiveTab(key)} className={`flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium transition ${activeTab === key ? 'bg-amber-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
            <Icon name={icon} size={16} /> {label}
          </button>
        ))}
      </nav>
    </aside>
  );
}

function LoadingScreen() {
  return (
    <div className="flex min-h-screen items-center justify-center bg-slate-50">
      <div className="text-center">
        <div className="mx-auto h-8 w-8 animate-spin rounded-full border-2 border-amber-500 border-t-transparent" />
        <p className="mt-3 text-sm text-slate-400">กำลังโหลดข้อมูล...</p>
      </div>
    </div>
  );
}

function App() {
  const storeRef = useRef(null);
  if (!storeRef.current) storeRef.current = createStore();
  const [ready, setReady] = useState(false);
  const [, setTick] = useState(0);
  const [activeTab, setActiveTab] = useState('dashboard');
  const refresh = useCallback(() => setTick((t) => t + 1), []);

  useEffect(() => {
    let cancelled = false;
    loadSnapshotFromFirestore().then((snap) => {
      if (cancelled) return;
      const store = storeRef.current;
      if (snap) store.hydrate(snap);
      MUTATORS.forEach((name) => {
        const orig = store[name];
        if (typeof orig === 'function') {
          store[name] = (...args) => {
            const r = orig.apply(store, args);
            scheduleSave(store);
            return r;
          };
        }
      });
      setReady(true);
    });
    return () => { cancelled = true; };
  }, []);

  if (!ready) return <LoadingScreen />;

  const store = storeRef.current;
  const activeEntry = TABS.find(([key]) => key === activeTab);
  const ActiveComponent = activeEntry[3];

  return (
    <div className="flex min-h-screen">
      <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
      <main className="min-w-0 flex-1 p-8">
        <ActiveComponent store={store} refresh={refresh} />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
